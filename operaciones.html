<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Centro de Operaciones - Que!Cuerno$</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Impact', 'Arial Black', sans-serif;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 100vh;
    }

    /* Header */
    header {
      background: #000;
      text-align: center;
      padding: 8px 0;
      border-bottom: 2px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 {
      color: #fff;
      font-size: 2.2rem;
      flex-grow: 1;
    }

    .btn-back {
      font-size: 1.8rem;
      cursor: pointer;
      text-decoration: none;
      color: #fff;
    }

    /* Horario de Entrega Interactivo */
    .schedule-box {
      border: 2px solid #ffffff;
      padding: 10px;
      text-align: center;
      font-size: 1.5rem;
      cursor: pointer;
      border-radius: 8px;
      background-color: #ff0000;
      color: #ffffff;
      transition: background-color 0.2s ease;
      user-select: none;
    }

    .schedule-box.active {
      background-color: #00e676;
      color: #000000;
    }

    /* Sección Órdenes + Clientes */
    .top-section {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 10px;
      height: 140px;
    }

    .orders-scroll {
      border: 1px solid #444;
      border-radius: 8px;
      padding: 8px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: #0a0a0a;
    }

    .order-item {
      background: #1e1e1e;
      padding: 6px;
      border-radius: 4px;
      font-size: 1rem;
      cursor: pointer;
      border-left: 3px solid #ffff00;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Contenedor de Clientes */
    .clients-scroll {
      border: 1px solid #444;
      border-radius: 8px;
      padding: 8px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      align-content: start;
      justify-items: center;
      background: #0a0a0a;
    }

    .client-avatar-container {
      position: relative;
      display: inline-block;
      transition: all 0.3s ease;
    }

    .client-avatar {
      width: 45px;
      height: 45px;
      border-radius: 50%;
      border: 2px solid #ffff00;
      flex-shrink: 0;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
    }

    .unread-badge {
      position: absolute;
      top: -2px;
      right: -2px;
      background-color: #ff0000;
      color: #ffffff;
      font-size: 0.75rem;
      font-family: Arial, sans-serif;
      font-weight: bold;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #000;
    }

    /* Grid/Contenedor de Órdenes Pendientes de Pago (Con scroll de alto fijo) */
    .pending-container {
      border: 1px solid #444;
      border-radius: 8px;
      padding: 8px;
      background: #0a0a0a;
      max-height: 110px;
      overflow-y: auto;
    }

    .pending-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .pending-card {
      border: 1px solid #ff9800;
      background: #111;
      padding: 10px 4px;
      border-radius: 6px;
      text-align: center;
      font-size: 0.9rem;
      cursor: pointer;
      color: #fff;
    }

    .pending-card:hover {
      background: #222;
    }

    /* Mapa GPS */
    #map {
      width: 100%;
      height: 180px;
      border-radius: 8px;
      border: 1px solid #444;
      z-index: 1;
    }

    /* Footer */
    footer {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: auto;
    }

    .btn-action {
      background: #1a1a1a;
      border: 2px solid #fff;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-size: 1.8rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Modales */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10000;
    }

    .modal-card {
      background: #000000;
      border: 2px solid #ffffff;
      border-radius: 12px;
      width: 90%;
      max-width: 360px;
      padding: 16px;
      position: relative;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-close {
      position: absolute;
      top: 10px;
      left: 10px;
      font-size: 1.4rem;
      cursor: pointer;
      background: none;
      border: none;
      color: #ff0000;
    }

    .modal-title {
      text-align: center;
      font-size: 1.6rem;
      letter-spacing: 1px;
    }

    .modal-header-grid {
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 10px;
      align-items: center;
      border-bottom: 1px solid #333;
      padding-bottom: 12px;
    }

    .client-info-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .client-avatar-large {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 2px solid #ffff00;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
    }

    .comanda-box {
      border: 1px solid #444;
      border-radius: 8px;
      padding: 8px;
      background: #111;
      font-size: 0.9rem;
    }

    .comanda-box h4 {
      color: #ffff00;
      margin-bottom: 4px;
      font-size: 1rem;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
      font-size: 0.95rem;
      border-bottom: 1px solid #222;
      padding-bottom: 6px;
      font-family: Arial, sans-serif;
    }

    .detail-item label {
      color: #888;
      font-size: 0.75rem;
      text-transform: uppercase;
      font-weight: bold;
    }

    .detail-item span {
      color: #fff;
    }

    .btn-yellow-delivered {
      background: #ffff00;
      color: #000000;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1.2rem;
      cursor: pointer;
      font-weight: bold;
      margin-top: 6px;
      text-align: center;
    }

    .btn-main-green {
      background: #00e676;
      color: #000000;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 1.3rem;
      cursor: pointer;
      font-weight: bold;
      margin-top: 6px;
    }

    /* Modal Chat */
    .chat-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      border-bottom: 1px solid #333;
      padding-bottom: 8px;
      margin-top: 10px;
    }

    .chat-body {
      height: 180px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 6px;
      background: #0a0a0a;
      border-radius: 8px;
      border: 1px solid #222;
    }

    .chat-msg {
      max-width: 80%;
      padding: 6px 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-family: Arial, sans-serif;
    }

    .chat-msg.client {
      background: #222;
      align-self: flex-start;
    }

    .chat-msg.admin {
      background: #1e3d2f;
      color: #00e676;
      align-self: flex-end;
    }

    .msg-time {
      font-size: 0.65rem;
      color: #888;
      float: right;
      margin-left: 8px;
      margin-top: 4px;
    }

    .chat-bottom-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .chat-btn-small {
      flex: 1;
      background: #1f1f1f;
      border: 1px solid #444;
      color: #fff;
      padding: 6px;
      border-radius: 6px;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .chat-input-row {
      display: flex;
      gap: 6px;
    }

    .chat-input-row input {
      flex: 1;
      background: #111;
      border: 1px solid #444;
      color: #fff;
      padding: 8px 10px;
      border-radius: 6px;
      font-family: Arial, sans-serif;
      font-size: 0.95rem;
      outline: none;
    }

    .btn-send {
      background: #00e676;
      border: none;
      padding: 0 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      font-size: 1rem;
    }

    /* Timer Style */
    .timer-display {
      font-size: 1.4rem;
      color: #ff3d00;
      text-align: center;
      font-weight: bold;
      font-family: monospace;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <header>
    <a href="admin.html" class="btn-back">⬅️</a>
    <h1>Que!Cuerno$</h1>
  </header>

  <div class="schedule-box" id="scheduleBtn" onclick="toggleSchedule()">
    ⏰ 01:00 - 12:00
  </div>

  <div class="top-section">
    <div class="orders-scroll" id="ordersList">
      </div>
    
    <div class="clients-scroll" id="clientsList">
      </div>
  </div>

  <div class="pending-container">
    <div class="pending-grid" id="pendingGrid">
      </div>
  </div>

  <div id="map"></div>

  <footer>
    <button class="btn-action" onclick="lanzarCuernoFlotante()">🥐</button>
    <button class="btn-action" onclick="openModal('modalRegistroVenta')">✅</button>
  </footer>

  <div class="modal-overlay" id="modalChat">
    <div class="modal-card">
      <button class="btn-close" style="position: static;" onclick="closeModal('modalChat')">❌</button>
      <div class="chat-header">
        <div class="client-avatar" id="chatAvatar" style="width: 50px; height: 50px; font-size: 1.5rem;">👤</div>
        <span id="chatName" style="font-size: 1.1rem; margin-top: 4px;">@cliente</span>
      </div>

      <div class="chat-body" id="chatBody">
        <div class="chat-msg client">
          ¡Hola! Acabo de transferir mi pedido.
          <span class="msg-time">14:02</span>
        </div>
      </div>

      <div class="chat-input-row">
        <input type="text" id="chatInput" placeholder="Escribe un mensaje..." onkeypress="handleKeyPress(event)">
        <button class="btn-send" onclick="enviarMensajeChat()">➤</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOrden">
    <div class="modal-card">
      <button class="btn-close" onclick="closeModal('modalOrden')">❌</button>
      <div class="modal-title" id="ordenTitulo">Orden #1</div>

      <div class="modal-header-grid">
        <div class="client-info-box">
          <div class="client-avatar-large" id="ordenAvatar">👤</div>
          <span style="font-size: 0.85rem; color: #fff;" id="ordenClienteUser">@cliente</span>
        </div>
        <div class="comanda-box">
          <h4>Comanda</h4>
          <p id="ordenComandaTexto">• 1x Jamón y Queso</p>
        </div>
      </div>

      <div class="detail-item">
        <label>Dirección de entrega</label>
        <span id="ordenDireccion">Av. Principal #123, Col. Centro</span>
      </div>

      <div class="detail-item">
        <label>Hora de entrega</label>
        <span>02:30 PM</span>
      </div>

      <button class="btn-yellow-delivered" onclick="marcarOrdenEntregada()">Orden Entregada 🚚</button>
    </div>
  </div>

  <div class="modal-overlay" id="modalPendiente">
    <div class="modal-card">
      <button class="btn-close" onclick="closeModal('modalPendiente')">❌</button>
      <div class="modal-title">Pendiente Pago</div>

      <div class="modal-header-grid">
        <div class="client-info-box">
          <div class="client-avatar-large" id="pendingAvatar">👤</div>
          <span style="font-size: 0.85rem; color: #fff;" id="pendingUser">@usuario</span>
        </div>
        <div class="comanda-box">
          <h4>Comanda</h4>
          <p id="pendingComanda">• 1x Jamón y Queso</p>
        </div>
      </div>

      <div class="detail-item">
        <label>Método de pago</label>
        <span>SPEI Transferencia ($35.00)</span>
      </div>

      <div class="detail-item">
        <label>Pago por parte de</label>
        <span style="color: #ffff00; font-weight: bold;" id="pendingNombre">Juan Pérez Morales</span>
        <div class="timer-display" id="pendingTimer">30:00</div>
      </div>

      <button class="btn-main-green" onclick="confirmarPagoActual()">Confirmar Pago</button>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    // Base de Datos en memoria
    let pendingPayments = [
      { id: 'p1', code: 'P-1', user: '@juan_p', name: 'Juan Pérez Morales', avatar: '👤', comanda: '• 1x Jamón y Queso', address: 'Calle Rosales #45', secondsLeft: 1800 },
      { id: 'p2', code: 'P-2', user: '@maria_g', name: 'María Gómez', avatar: '👩', comanda: '• 2x Nutella Especial', address: 'Av. Hidalgo #12', secondsLeft: 1800 },
      { id: 'p3', code: 'P-3', user: '@carlos_m', name: 'Carlos Mendoza', avatar: '🧔', comanda: '• 1x Queso y Tocino', address: 'Col. San Jose #89', secondsLeft: 1800 },
      { id: 'p4', code: 'P-4', user: '@laura_s', name: 'Laura Silva', avatar: '👩‍🦰', comanda: '• 3x Jamón y Queso', address: 'Av. Juarez #102', secondsLeft: 1800 }
    ];

    let activeOrders = [];
    let activeClients = [];
    let selectedPendingId = null;
    let currentActiveOrderId = null;
    let timerInterval = null;

    function init() {
      renderPendingGrid();
      startGlobalTimer();
    }

    function toggleSchedule() {
      document.getElementById('scheduleBtn').classList.toggle('active');
    }

    function openModal(id) {
      document.getElementById('map').style.display = 'none';
      document.getElementById(id).style.display = 'flex';
    }

    function closeModal(id) {
      document.getElementById(id).style.display = 'none';
      const mapContainer = document.getElementById('map');
      mapContainer.style.display = 'block';
      if (typeof map !== 'undefined') map.invalidateSize();
    }

    // Renderizar tarjetas de pagos pendientes
    function renderPendingGrid() {
      const grid = document.getElementById('pendingGrid');
      grid.innerHTML = '';
      pendingPayments.forEach(p => {
        const card = document.createElement('div');
        card.className = 'pending-card';
        card.innerText = p.code;
        card.onclick = () => abrirModalPendiente(p.id);
        grid.appendChild(card);
      });
    }

    function abrirModalPendiente(id) {
      selectedPendingId = id;
      const item = pendingPayments.find(p => p.id === id);
      if (!item) return;

      document.getElementById('pendingAvatar').innerText = item.avatar;
      document.getElementById('pendingUser').innerText = item.user;
      document.getElementById('pendingComanda').innerText = item.comanda;
      document.getElementById('pendingNombre').innerText = item.name;

      updateTimerDisplay(item.secondsLeft);
      openModal('modalPendiente');
    }

    // Timer de 30 minutos por pedido pendiente
    function startGlobalTimer() {
      setInterval(() => {
        pendingPayments.forEach((p, index) => {
          p.secondsLeft--;
          if (p.secondsLeft <= 0) {
            // Cancelar pedido automáticamente tras 30 min
            pendingPayments.splice(index, 1);
            renderPendingGrid();
            if (selectedPendingId === p.id) closeModal('modalPendiente');
          }
        });

        if (selectedPendingId) {
          const item = pendingPayments.find(p => p.id === selectedPendingId);
          if (item) updateTimerDisplay(item.secondsLeft);
        }
      }, 1000);
    }

    function updateTimerDisplay(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      document.getElementById('pendingTimer').innerText = 
        `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // Al confirmar pago: crea la orden exacta, abre el chat y sincroniza
    function confirmarPagoActual() {
      const itemIndex = pendingPayments.findIndex(p => p.id === selectedPendingId);
      if (itemIndex === -1) return;

      const item = pendingPayments[itemIndex];
      const orderNum = activeOrders.length + 1;
      const orderId = `ord-${Date.now()}`;
      const clientId = `cli-${Date.now()}`;

      const newOrder = {
        id: orderId,
        title: `Orden #${orderNum}`,
        user: item.user,
        avatar: item.avatar,
        comanda: item.comanda,
        address: item.address,
        clientId: clientId
      };

      const newClient = {
        id: clientId,
        name: item.name,
        user: item.user,
        avatar: item.avatar,
        orderId: orderId
      };

      activeOrders.push(newOrder);
      activeClients.unshift(newClient); // Pone el chat al inicio

      pendingPayments.splice(itemIndex, 1);

      renderPendingGrid();
      renderOrdersAndClients();
      closeModal('modalPendiente');
    }

    function renderOrdersAndClients() {
      const ordersList = document.getElementById('ordersList');
      const clientsList = document.getElementById('clientsList');

      ordersList.innerHTML = '';
      clientsList.innerHTML = '';

      activeOrders.forEach(o => {
        const item = document.createElement('div');
        item.className = 'order-item';
        item.innerHTML = `${o.title} 🥐`;
        item.onclick = () => abrirOrdenYChat(o.id);
        ordersList.appendChild(item);
      });

      activeClients.forEach(c => {
        const container = document.createElement('div');
        container.className = 'client-avatar-container';
        container.id = c.id;
        container.onclick = () => openChat(c.user, c.avatar);
        container.innerHTML = `<div class="client-avatar">${c.avatar}</div>`;
        clientsList.appendChild(container);
      });
    }

    // Abre la orden e invoca el chat correspondiente al lado
    function abrirOrdenYChat(orderId) {
      currentActiveOrderId = orderId;
      const order = activeOrders.find(o => o.id === orderId);
      if (!order) return;

      document.getElementById('ordenTitulo').innerText = order.title;
      document.getElementById('ordenAvatar').innerText = order.avatar;
      document.getElementById('ordenClienteUser').innerText = order.user;
      document.getElementById('ordenComandaTexto').innerText = order.comanda;
      document.getElementById('ordenDireccion').innerText = order.address;

      openModal('modalOrden');
      // Sincroniza abriendo el chat correspondiente
      openChat(order.user, order.avatar);
    }

    function openChat(nombre, avatar) {
      document.getElementById('chatName').innerText = nombre;
      document.getElementById('chatAvatar').innerText = avatar;
      openModal('modalChat');
    }

    function marcarOrdenEntregada() {
      if (currentActiveOrderId) {
        const order = activeOrders.find(o => o.id === currentActiveOrderId);
        if (order) {
          activeOrders = activeOrders.filter(o => o.id !== currentActiveOrderId);
          activeClients = activeClients.filter(c => c.id !== order.clientId);
        }
      }
      renderOrdersAndClients();
      closeModal('modalOrden');
      closeModal('modalChat');
    }

    function enviarMensajeChat() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (text !== '') {
        const chatBody = document.getElementById('chatBody');
        const now = new Date();
        const timeStr = now.getHours().toString().padStart(2, '0') + ':' + now.getMinutes().toString().padStart(2, '0');
        
        const msgDiv = document.createElement('div');
        msgDiv.className = 'chat-msg admin';
        msgDiv.innerHTML = `${text} <span class="msg-time">${timeStr} ✓</span>`;
        
        chatBody.appendChild(msgDiv);
        chatBody.scrollTop = chatBody.scrollHeight;
        input.value = '';
      }
    }

    function handleKeyPress(e) {
      if (e.key === 'Enter') enviarMensajeChat();
    }

    function lanzarCuernoFlotante() {}

    // Inicializar Mapa y datos
    const map = L.map('map').setView([19.6865, -99.1126], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    L.marker([19.6865, -99.1126]).addTo(map).bindPopup('Centro de Operaciones').openPopup();

    init();
  </script>
</body>
</html>
