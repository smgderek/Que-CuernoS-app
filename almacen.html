<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almacén - Que!Cuerno$</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Impact', sans-serif, Arial, sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #f3f3f3;
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* 1. Nombre del Negocio */
        .brand-title {
            text-align: center;
            color: #ffcc00;
            font-size: 1.8rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        /* 2. Cuadro Grande de Ingredientes (con barra superior y flechas) */
        .ingredients-box {
            background: #161616;
            border: 2px solid #262626;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .ingredients-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: #222;
            padding: 8px 12px;
            border-radius: 8px;
        }

        .arrow-btn {
            background: none;
            border: none;
            color: #ffcc00;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 10px;
        }

        .category-display {
            font-size: 1rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Contenedor de círculos de emojis */
        .circles-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            min-height: 90px;
            align-items: center;
        }

        .ingredient-circle {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            transition: transform 0.1s;
            border: 2px solid transparent;
        }

        .ingredient-circle:active {
            transform: scale(0.92);
        }

        /* Colores según stock solicitado */
        .stock-black { background-color: #1a1a1a; border-color: #444; opacity: 0.5; } /* 0 */
        .stock-red { background-color: #8b0000; border-color: #ff4d4d; }             /* 1 a 10 */
        .stock-yellow { background-color: #b8860b; border-color: #ffcc00; }          /* 11 a 50 */
        .stock-green { background-color: #006400; border-color: #28a745; }           /* 51 a 1000 */

        /* 3. Rectángulo Superior de Estadísticas */
        .stats-rectangle {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 15px;
            transition: background 0.2s;
        }

        .stats-rectangle:hover {
            background: #222;
            border-color: #ffcc00;
        }

        .stats-title {
            font-size: 1rem;
            color: #ffcc00;
        }

        /* 4. Contenedores Inferiores (Dos cuadros lado a lado) */
        .bottom-panels {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .panel-box {
            background: #161616;
            border: 1px solid #262626;
            border-radius: 10px;
            padding: 12px;
        }

        .panel-title {
            font-size: 0.9rem;
            color: #aaa;
            margin-bottom: 10px;
            border-bottom: 1px solid #222;
            padding-bottom: 5px;
        }

        .panel-content input, .panel-content select {
            width: 100%;
            padding: 8px;
            margin-bottom: 8px;
            background: #0f0f0f;
            border: 1px solid #333;
            color: #fff;
            border-radius: 6px;
            font-size: 0.9rem;
        }

        .panel-content button {
            width: 100%;
            padding: 8px;
            background: #ffcc00;
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1 class="brand-title">Que!Cuerno$</h1>

    <div class="ingredients-box">
        <div class="ingredients-header">
            <button class="arrow-btn" onclick="changeCategory(-1)">◀</button>
            <span class="category-display" id="categoryTitle">Todos</span>
            <button class="arrow-btn" onclick="changeCategory(1)">▶</button>
        </div>
        <div class="circles-grid" id="circlesContainer">
            </div>
    </div>

    <div class="stats-rectangle" onclick="openStatsModal()">
        <span class="stats-title">📊 Ver Estadísticas de Uso de Ingredientes</span>
    </div>

    <div class="bottom-panels">
        
        <div class="panel-box">
            <div class="panel-title">💰 Registro de Compra</div>
            <div class="panel-content">
                <input type="text" id="compraIngrediente" placeholder="Ingrediente">
                <input type="number" id="compraPrecio" placeholder="Precio ($)">
                <input type="date" id="compraFecha">
                <button onclick="registrarCompra()">Guardar Compra</button>
            </div>
        </div>

        <div class="panel-box">
            <div class="panel-title">⚙️ Gestor de Stock</div>
            <div class="panel-content">
                <input type="text" id="gestorNombre" placeholder="Nombre / Emoji">
                <input type="number" id="gestorStock" placeholder="Cantidad Stock">
                <button onclick="guardarStockMod()">Actualizar / Añadir</button>
            </div>
        </div>

    </div>

    <script>
        // Base de datos simulada de ingredientes con stock y categorías
        let ingredientes = [
            { nombre: "Jamón", emoji: "🥓", stock: 0, categoria: "salado" },
            { nombre: "Queso", emoji: "🧀", stock: 5, categoria: "salado" },
            { nombre: "Nutella", emoji: "🍫", stock: 25, categoria: "dulce" },
            { nombre: "Fresa", emoji: "🍓", stock: 80, categoria: "dulce" },
            { nombre: "Tocino", emoji: "🍖", stock: 120, categoria: "salado" }
        ];

        let categorias = ["todos", "salados", "dulces"];
        let categoriaIndex = 0;

        // Función para determinar el color según los rangos exactos que pediste:
        // Negro (0), Rojo (1-10), Amarillo (11-50), Verde (51-1000)
        function getStockClass(stock) {
            if (stock === 0) return "stock-black";
            if (stock >= 1 && stock <= 10) return "stock-red";
            if (stock >= 11 && stock <= 50) return "stock-yellow";
            if (stock >= 51) return "stock-green";
            return "stock-black";
        }

        // Renderizar círculos en el cuadro grande
        function renderIngredients() {
            const container = document.getElementById("circlesContainer");
            container.innerHTML = "";

            let catActual = categorias[categoriaIndex];
            document.getElementById("categoryTitle").textContent = catActual.toUpperCase();

            ingredientes.forEach(ing => {
                if (catActual === "todos" || ing.categoria === catActual.slice(0, -1)) {
                    const circle = document.createElement("div");
                    circle.className = `ingredient-circle ${getStockClass(ing.stock)}`;
                    circle.innerHTML = ing.emoji;
                    circle.title = `${ing.nombre}: ${ing.stock} unidades`;
                    circle.onclick = () => alert(`Detalles:\nIngrediente: ${ing.nombre}\nStock actual: ${ing.stock} unidades`);
                    container.appendChild(circle);
                }
            });
        }

        // Cambiar categoría con las flechas laterales
        function changeCategory(direction) {
            categoriaIndex += direction;
            if (categoriaIndex < 0) categoriaIndex = categorias.length - 1;
            if (categoriaIndex >= categorias.length) categoriaIndex = 0;
            renderIngredients();
        }

        // Funciones básicas para los cuadros inferiores
        function registrarCompra() {
            const ing = document.getElementById("compraIngrediente").value;
            const precio = document.getElementById("compraPrecio").value;
            const fecha = document.getElementById("compraFecha").value;
            if(!ing || !precio) {
                alert("Por favor llena los datos de compra.");
                return;
            }
            alert(`Compra registrada:\n${ing} - $${precio} (${fecha || 'Fecha actual'})`);
        }

        function guardarStockMod() {
            const nombre = document.getElementById("gestorNombre").value;
            const stock = parseInt(document.getElementById("gestorStock").value);
            if(!nombre || isNaN(stock)) {
                alert("Ingresa nombre y cantidad válida.");
                return;
            }
            // Buscar si ya existe para actualizarlo o agregarlo
            let existe = ingredientes.find(i => i.nombre.toLowerCase() === nombre.toLowerCase());
            if(existe) {
                existe.stock = stock;
            } else {
                ingredientes.push({ nombre: nombre, emoji: "📦", stock: stock, categoria: "salado" });
            }
            renderIngredients();
            alert("Stock actualizado correctamente.");
        }

        function openStatsModal() {
            alert("Pantalla desplegable de Estadísticas de Uso de Ingredientes (Fechas de entrada/salida).");
        }

        // Inicializar vista
        renderIngredients();
    </script>
</body>
</html>
