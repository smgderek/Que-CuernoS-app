<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almacén - Que!Cuerno$</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Impact', sans-serif, Arial, sans-serif;
        }

        body {
            background-color: #0f0f0f;
            color: #f3f3f3;
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* 1. Nombre del Negocio */
        .brand-title {
            text-align: center;
            color: #ffcc00;
            font-size: 1.8rem;
            margin-bottom: 15px;
            letter-spacing: 1px;
        }

        /* 2. Cuadro Grande de Ingredientes con Scroll Vertical */
        .ingredients-box {
            background: #161616;
            border: 2px solid #262626;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .ingredients-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            background: #222;
            padding: 8px 12px;
            border-radius: 8px;
        }

        .arrow-btn {
            background: none;
            border: none;
            color: #ffcc00;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 10px;
        }

        .category-display {
            font-size: 1rem;
            color: #fff;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Contenedor con Scroll Vertical para +50 ingredientes */
        .circles-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            max-height: 280px;
            overflow-y: auto;
            padding: 5px;
        }

        .ingredient-circle {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            cursor: pointer;
            transition: transform 0.1s;
            border: 2px solid transparent;
        }

        .ingredient-circle:active {
            transform: scale(0.92);
        }

        /* Colores según rangos de stock solicitados */
        .stock-black { background-color: #1a1a1a; border-color: #333; opacity: 0.4; } /* 0 */
        .stock-red { background-color: #7a0c0c; border-color: #ff4d4d; }             /* 1 a 10 */
        .stock-yellow { background-color: #8c7300; border-color: #ffcc00; }          /* 11 a 50 */
        .stock-green { background-color: #0b5329; border-color: #28a745; }           /* 51 a 1000 */

        /* 3. Rectángulo Superior de Estadísticas */
        .stats-rectangle {
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            cursor: pointer;
            margin-bottom: 15px;
            transition: background 0.2s;
        }

        .stats-rectangle:hover {
            background: #222;
            border-color: #ffcc00;
        }

        .stats-title {
            font-size: 1rem;
            color: #ffcc00;
        }

        /* 4. Botones de Pantallas Desplegables Inferiores */
        .bottom-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .action-btn {
            background: #161616;
            border: 1px solid #333;
            color: #fff;
            padding: 15px;
            border-radius: 10px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .action-btn:hover {
            background: #222;
            border-color: #ffcc00;
        }

        /* Estilos de Modales Desplegables */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 100;
            padding: 20px;
        }

        .modal-content {
            background: #161616;
            border: 2px solid #333;
            border-radius: 12px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            position: relative;
        }

        .modal-title {
            color: #ffcc00;
            font-size: 1.2rem;
            margin-bottom: 15px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .modal-content input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            background: #0f0f0f;
            border: 1px solid #333;
            color: #fff;
            border-radius: 6px;
        }

        .modal-content button.save-btn {
            width: 100%;
            padding: 10px;
            background: #ffcc00;
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        .close-modal {
            position: absolute;
            top: 15px; right: 20px;
            background: none;
            border: none;
            color: #aaa;
            font-size: 1.3rem;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1 class="brand-title">Que!Cuerno$</h1>

    <div class="ingredients-box">
        <div class="ingredients-header">
            <button class="arrow-btn" onclick="changeCategory(-1)">◀</button>
            <span class="category-display" id="categoryTitle">Todos</span>
            <button class="arrow-btn" onclick="changeCategory(1)">▶</button>
        </div>
        <div class="circles-grid" id="circlesContainer">
            </div>
    </div>

    <div class="stats-rectangle" onclick="openModal('statsModal')">
        <span class="stats-title">📊 Estadísticas de Uso (Entradas / Salidas)</span>
    </div>

    <div class="bottom-actions">
        <button class="action-btn" onclick="openModal('compraModal')">💰 Registrar Precios y Compra</button>
        <button class="action-btn" onclick="openModal('gestorModal')">⚙️ Modificar / Agregar Stock</button>
    </div>

    <div class="modal" id="compraModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('compraModal')">&times;</button>
            <div class="modal-title">💰 Registro de Compra de Ingredientes</div>
            <input type="text" id="compraIngrediente" placeholder="Nombre del ingrediente">
            <input type="number" id="compraPrecio" placeholder="Precio de compra ($)">
            <input type="date" id="compraFecha">
            <button class="save-btn" onclick="registrarCompra()">Guardar Compra</button>
        </div>
    </div>

    <div class="modal" id="gestorModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('gestorModal')">&times;</button>
            <div class="modal-title">⚙️ Gestor de Stock (Modificar / Eliminar)</div>
            <input type="text" id="gestorNombre" placeholder="Nombre del ingrediente">
            <input type="text" id="gestorEmoji" placeholder="Emoji representativo (ej: 🥓)">
            <input type="number" id="gestorStock" placeholder="Cantidad de stock actual">
            <input type="text" id="gestorCategoria" placeholder="Categoría (salado / dulce)">
            <button class="save-btn" onclick="guardarStockMod()">Guardar Cambios</button>
        </div>
    </div>

    <div class="modal" id="statsModal">
        <div class="modal-content">
            <button class="close-modal" onclick="closeModal('statsModal')">&times;</button>
            <div class="modal-title">📊 Estadísticas de Uso</div>
            <p style="font-size: 0.9rem; color: #ccc; line-height: 1.4;">
                Aquí se registran las fechas de entrada y salida de los ingredientes con mayor rotación en la cocina.
            </p>
        </div>
    </div>

    <script>
        // Lista simulada de ingredientes (puedes tener más de 50 y se acomodarán perfectamente con scroll)
        let ingredientes = [
            { nombre: "Jamón", emoji: "🥓", stock: 0, categoria: "salado" },
            { nombre: "Queso", emoji: "🧀", stock: 8, categoria: "salado" },
            { nombre: "Tocino", emoji: "🍖", stock: 35, categoria: "salado" },
            { nombre: "Nutella", emoji: "🍫", stock: 120, categoria: "dulce" },
            { nombre: "Fresa", emoji: "🍓", stock: 45, categoria: "dulce" },
            { nombre: "Masa Hojaldre", emoji: "🥐", stock: 550, categoria: "salado" }
        ];

        let categorias = ["todos", "salados", "dulces"];
        let categoriaIndex = 0;

        // Regla de colores basada en stock exacto:
        // 0: Negro | 1-10: Rojo | 11-50: Amarillo | 51-1000: Verde
        function getStockClass(stock) {
            if (stock === 0) return "stock-black";
            if (stock >= 1 && stock <= 10) return "stock-red";
            if (stock >= 11 && stock <= 50) return "stock-yellow";
            if (stock >= 51) return "stock-green";
            return "stock-black";
        }

        function renderIngredients() {
            const container = document.getElementById("circlesContainer");
            container.innerHTML = "";

            let catActual = categorias[categoriaIndex];
            document.getElementById("categoryTitle").textContent = catActual.toUpperCase();

            ingredientes.forEach(ing => {
                if (catActual === "todos" || ing.categoria === catActual.slice(0, -1)) {
                    const circle = document.createElement("div");
                    circle.className = `ingredient-circle ${getStockClass(ing.stock)}`;
                    circle.innerHTML = ing.emoji; // Solo emoji sin texto
                    circle.title = `${ing.nombre}: ${ing.stock} unidades`;
                    circle.onclick = () => alert(`Ingrediente: ${ing.nombre}\nStock actual: ${ing.stock} unidades`);
                    container.appendChild(circle);
                }
            });
        }

        function changeCategory(direction) {
            categoriaIndex += direction;
            if (categoriaIndex < 0) categoriaIndex = categorias.length - 1;
            if (categoriaIndex >= categorias.length) categoriaIndex = 0;
            renderIngredients();
        }

        // Control de modales desplegables
        function openModal(modalId) {
            document.getElementById(modalId).style.display = "flex";
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = "none";
        }

        // Acciones de formularios
        function registrarCompra() {
            alert("¡Compra y precio registrados correctamente!");
            closeModal('compraModal');
        }

        function guardarStockMod() {
            const nombre = document.getElementById("gestorNombre").value;
            const emoji = document.getElementById("gestorEmoji").value || "📦";
            const stock = parseInt(document.getElementById("gestorStock").value);
            const categoria = document.getElementById("gestorCategoria").value || "salado";

            if(!nombre || isNaN(stock)) {
                alert("Por favor completa los campos requeridos.");
                return;
            }

            let existe = ingredientes.find(i => i.nombre.toLowerCase() === nombre.toLowerCase());
            if(existe) {
                existe.stock = stock;
                existe.emoji = emoji;
            } else {
                ingredientes.push({ nombre, emoji, stock, categoria });
            }

            renderIngredients();
            closeModal('gestorModal');
            alert("Stock actualizado con éxito.");
        }

        // Inicializar
        renderIngredients();
    </script>
</body>
</html>
